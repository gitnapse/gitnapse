[package]
name = "gitnapse"
version = "0.1.1"
edition = "2024"
description = "A TUI tool to browse and manage your GitHub repositories"
license = "MIT"
authors = ["xscriptor"]

[features]
# TUI frontend. Disable (`--no-default-features`) when consuming GitNapse as a
# library/SDK from headless software (e.g. gitnapse-server).
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", optional = true }
directories = "6.0"
dotenvy = "0.15"

keyring = "=4.0.1"
keyring-core = "1.0"
octocrab = { version = "0.53", default-features = true }
ratatui = { version = "0.30", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rpassword = "7.4"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

rustls = { version = "0.23", features = ["ring"] }
tokio = { version = "1.48", features = ["rt", "time", "macros"] }
url = "2.5"
webbrowser = "1.0"

[dev-dependencies]
mockito = "1.7"
serial_test = "3.2"
temp-env = "0.3"
tempfile = "3.20"

[package.metadata.deb]
section = "utils"
priority = "optional"
assets = [
  ["target/release/gitnapse", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/gitnapse", dest = "/usr/bin/gitnapse", mode = "755" },
]
